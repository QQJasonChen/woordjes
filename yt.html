<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Woordjes player</title>
<style>html,body{margin:0;height:100%;background:#161616}iframe{display:block;width:100%;height:100%;border:0}</style>
</head><body>
<script>
// Woordjes loads from file://. This HTTPS relay gives YouTube's player a valid origin.
(function(){
  var q=new URLSearchParams(location.search),v=q.get('v')||'',s=parseInt(q.get('s'),10)||0,e=parseInt(q.get('e'),10)||0;
  if(!/^[A-Za-z0-9_-]{11}$/.test(v))return;
  var f=document.createElement('iframe');
  f.src='https://www.youtube-nocookie.com/embed/'+v+'?start='+Math.max(0,s)+(e>s?'&end='+e:'')+'&autoplay=1&playsinline=1&cc_load_policy=1&cc_lang_pref=nl&rel=0&origin='+encodeURIComponent(location.origin);
  f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;
  f.referrerPolicy='strict-origin-when-cross-origin';f.title='YouTube';
  document.body.appendChild(f);
})();
</script>
</body></html>
